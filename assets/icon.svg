<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#070B14"/>

  <!-- Main card -->
  <rect
    x="72"
    y="55"
    width="368"
    height="365"
    rx="52"
    fill="#0F172A"
    stroke="url(#g)"
    stroke-width="8"
  />

  <!-- Tech signal -->
  <path
    d="M145 125
       C174 96 212 82 256 82
       C300 82 338 96 367 125"
    fill="none"
    stroke="#38BDF8"
    stroke-width="9"
    stroke-linecap="round"
  />

  <circle cx="256" cy="82" r="9" fill="#38BDF8"/>

  <!-- TS -->
  <text
    x="256"
    y="265"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="150"
    font-weight="900"
    letter-spacing="-14"
    fill="url(#g)"
  >TS</text>

  <!-- Story lines -->
  <rect x="145" y="294" width="222" height="11" rx="5.5" fill="#E2E8F0"/>
  <rect x="178" y="321" width="156" height="9" rx="4.5" fill="#64748B"/>

  <!-- Sila Tech caption -->
  <text
    x="256"
    y="470"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="2"
    fill="#FFFFFF"
  >Sila Tech</text>

  <!-- Small accent -->
  <circle cx="126" cy="462" r="5" fill="#38BDF8"/>
  <circle cx="386" cy="462" r="5" fill="#38BDF8"/>
</svg>